[workspace]
resolver = "2"
members = [
    "crates/samd",
    "crates/samd-core",
    "crates/samd-macros",
    "crates/samd-wasm",
    "crates/samd-x86",
]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
version = "0.1.0"
keywords = ["simd", "no-std", "wasm"]
categories = ["no-std", "wasm"]
repository = "https://github.com/yuzmh/samd"

[workspace.dependencies]
criterion = "0.8.2"
libm = { version = "0.2", default-features = false }
proc-macro-crate = "3.5"
proc-macro2 = "1.0"
pulp = "0.22.3"
quote = "1.0"
samd-core = { path = "crates/samd-core", version = "0.1" }
samd-macros = { path = "crates/samd-macros", version = "0.1" }
samd-wasm = { path = "crates/samd-wasm", version = "0.1" }
samd-x86 = { path = "crates/samd-x86", version = "0.1" }
syn = {
    version = "3.0",
    default-features = false,
    features = ["clone-impls", "full", "parsing", "printing", "proc-macro", "visit"],
}

[profile.release]
lto = true
codegen-units = 1
